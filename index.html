const decode = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('unlockForm').addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('unlock');
  const status = document.getElementById('status');
  const field = document.getElementById('password');
  if (!globalThis.crypto || !crypto.subtle) {
    status.textContent = '이 환경에서 암호화를 사용할 수 없습니다. HTTPS 주소로 접속하세요.';
    return;
  }
  button.disabled = true;
  status.textContent = '잠금을 해제하는 중입니다.';
  try {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(field.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:decode(encrypted.salt), iterations:encrypted.iterations, hash:'SHA-256'}, material, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:decode(encrypted.iv), tagLength:128}, key, decode(encrypted.payload));
    field.value = '';
    const app = new TextDecoder().decode(plain);
    document.open();
    document.write(app);
    document.close();
  } catch (error) {
    status.textContent = '비밀번호가 올바르지 않거나 파일이 손상되었습니다.';
    button.disabled = false;
  }
});
